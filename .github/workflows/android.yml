name: Android
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      signing_configured: ${{ steps.signing.outputs.configured }}
    env:
      SIGNING_CONFIGURED: ${{ secrets.ZOWY_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect signing configuration
        id: signing
        run: echo "configured=$SIGNING_CONFIGURED" >> "$GITHUB_OUTPUT"
      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(awk '/^version:/ {print $2}' pubspec.yaml | cut -d+ -f1)
          test "$GITHUB_REF_NAME" = "v$version"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test integration_test tool
      - run: flutter analyze
      - run: flutter test
      - run: npm ci --ignore-scripts && npm audit --audit-level=high && npm test
        working-directory: tools/ubo-poc
      - run: flutter build apk --debug
      - run: sha256sum build/app/outputs/flutter-apk/app-debug.apk > build/app/outputs/flutter-apk/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/SHA256SUMS
      - name: Restore signing key
        if: (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) && env.SIGNING_CONFIGURED == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ZOWY_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/zowy-release.jks"
      - name: Build signed release
        if: (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) && env.SIGNING_CONFIGURED == 'true'
        env:
          ZOWY_KEYSTORE: ${{ runner.temp }}/zowy-release.jks
          ZOWY_STORE_PASSWORD: ${{ secrets.ZOWY_STORE_PASSWORD }}
          ZOWY_KEY_ALIAS: ${{ secrets.ZOWY_KEY_ALIAS }}
          ZOWY_KEY_PASSWORD: ${{ secrets.ZOWY_KEY_PASSWORD }}
        run: |
          version=$(awk '/^version:/ {print $2}' pubspec.yaml | cut -d+ -f1)
          mkdir -p build/release-assets
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "build/release-assets/Zowy-$version-universal-release.apk"
          flutter build apk --release --split-per-abi
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "build/release-assets/Zowy-$version-$abi-release.apk"
          done
          flutter build appbundle --release
          cp build/app/outputs/bundle/release/app-release.aab "build/release-assets/Zowy-$version.aab"
          cd build/release-assets
          sha256sum *.apk *.aab > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) && env.SIGNING_CONFIGURED == 'true'
        with:
          name: android-signed-release
          path: build/release-assets/
      - name: Explain development-only build
        if: startsWith(github.ref, 'refs/tags/v') && env.SIGNING_CONFIGURED != 'true'
        run: echo 'Signing secrets are not configured. CI verified a debug APK; it will not publish a release with a fresh temporary signing key.' >> "$GITHUB_STEP_SUMMARY"
  release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') && needs.verify.outputs.signing_configured == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-signed-release
          path: signed-release
      - name: Publish signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" signed-release/* --verify-tag --title "Zowy ${GITHUB_REF_NAME#v}" --generate-notes
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
